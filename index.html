  :root {
    color-scheme: dark;
    /* 宵 — night ground */
    --yoi: #171430;
    --yoi-deep: #100d24;
    /* 黄昏 — panels */
    --tasogare: #221d42;
    --tasogare-edge: #322a5c;
    /* 茜 — sunset coral (primary accent, spent sparingly) */
    --akane: #ff6d5e;
    --akane-deep: #e5503f;
    /* 月 — moon gold (ratings, countdowns) */
    --tsuki: #ffc96b;
    /* 藤 — wisteria muted text */
    --fuji: #a79fce;
    --fuji-dim: #6f679c;
    /* 雪 — near-white text */
    --yuki: #f4f1ff;

    --mincho: "YZ Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "YZ Mincho", sans-serif;

    --r-card: 14px;
    --shell-w: 430px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--yoi-deep);
    color: var(--yuki);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ambient page behind the phone on wide screens */
  .stage {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1200px 700px at 50% -10%, #2b2154 0%, transparent 60%),
      radial-gradient(900px 500px at 85% 110%, #3a1e3f 0%, transparent 55%),
      var(--yoi-deep);
  }

  .phone {
    width: 100%;
    max-width: var(--shell-w);
    height: 100dvh;
    background: var(--yoi);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  @media (min-width: 520px) and (min-height: 700px) {
    .phone {
      height: min(880px, 94dvh);
      border-radius: 38px;
      border: 1px solid #3d3468;
      box-shadow:
        0 40px 90px -30px rgba(0, 0, 0, .8),
        0 0 0 8px #0b0919,
        0 0 120px -40px rgba(255, 109, 94, .35);
    }
  }

  /* ---------- app bar ---------- */
  .appbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px 12px;
    flex: none;
  }

  .logo {
    font-family: var(--mincho);
    font-weight: 800;
    font-size: 21px;
    letter-spacing: .14em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo svg { display: block; }

  .season-chip {
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--fuji);
    border: 1px solid var(--tasogare-edge);
    border-radius: 999px;
    padding: 3px 10px 2px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .appbar .bell {
    margin-left: auto;
    width: 36px;
    height: 36px;
    border-radius: 12px;
    border: 1px solid var(--tasogare-edge);
    background: transparent;
    color: var(--fuji);
    display: grid;
    place-items: center;
    cursor: pointer;
    position: relative;
  }
  .bell .dot {
    position: absolute;
    top: 8px; right: 9px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--akane);
  }

  /* ---------- scroll body ---------- */
  .scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  .scroll::-webkit-scrollbar { display: none; }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    margin: 4px 14px 0;
    height: 425px;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid #3b2f66;
  }

  .hero canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .hero .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(16, 13, 36, .96) 0%, rgba(16, 13, 36, .55) 24%, rgba(16, 13, 36, .18) 38%, transparent 52%);
    pointer-events: none;
  }

  .hero .eyebrow {
    position: absolute;
    top: 16px; left: 18px;
    font-size: 10px;
    letter-spacing: .28em;
    color: #ffe3d6;
    text-shadow: 0 1px 8px rgba(20, 10, 40, .8);
  }
  .hero .eyebrow b {
    font-weight: 600;
    color: var(--tsuki);
    margin-right: 8px;
    letter-spacing: .18em;
  }

  /* vertical title — anime title-card move */
  .hero .tate {
    position: absolute;
    top: 36px;
    right: 18px;
    writing-mode: vertical-rl;

      '<g fill="#ffb3cf"><ellipse cx="60" cy="40" rx="3" ry="4.4"/><ellipse cx="54" cy="48" rx="3" ry="4.4" transform="rotate(-72 54 48)"/><ellipse cx="66" cy="48" rx="3" ry="4.4" transform="rotate(72 66 48)"/><ellipse cx="56.5" cy="42" rx="1.4" ry="2" transform="rotate(-30 56.5 42)" opacity=".7"/></g>' +
      '<circle cx="24" cy="24" r="2" fill="#59e3ff" opacity=".8"/><circle cx="98" cy="60" r="2" fill="#59e3ff" opacity=".6"/><circle cx="90" cy="20" r="1.4" fill="#ff5f9e" opacity=".7"/>' +
      '</svg>',
    getsumen:
      '<svg viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      '<defs><linearGradient id="g-ge" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#0d0c22"/><stop offset="1" stop-color="#211d44"/></linearGradient></defs>' +
      '<rect width="120" height="120" fill="url(#g-ge)"/>' +
      '<circle cx="60" cy="52" r="30" fill="#f4ead0"/>' +
      '<circle cx="50" cy="44" r="5" fill="#ddd0b2"/><circle cx="70" cy="58" r="7" fill="#ddd0b2"/><circle cx="58" cy="68" r="3.4" fill="#ddd0b2"/><circle cx="72" cy="40" r="2.6" fill="#ddd0b2"/>' +
      '<circle cx="60" cy="52" r="34" fill="none" stroke="#f4ead0" opacity=".18" stroke-width="5"/>' +
      '<rect y="98" width="120" height="22" fill="#12102a"/>' +
      '<rect x="76" y="86" width="18" height="14" rx="2" fill="#12102a"/>' +
      '<rect x="80" y="90" width="4.6" height="5.4" rx="1" fill="#ffc96b"/><rect x="87" y="90" width="4.6" height="5.4" rx="1" fill="#ffc96b"/>' +
      '<circle cx="18" cy="18" r="1.2" fill="#fff" opacity=".7"/><circle cx="102" cy="26" r="1" fill="#fff" opacity=".6"/>' +
      '</svg>',
    mermaid:
      '<svg viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      '<defs><linearGradient id="g-me" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#7fc6dc"/><stop offset=".55" stop-color="#bfe4ec"/><stop offset=".56" stop-color="#2e7f9e"/><stop offset="1" stop-color="#174e6b"/></linearGradient></defs>' +
      '<rect width="120" height="120" fill="url(#g-me)"/>' +
      '<circle cx="96" cy="16" r="10" fill="#ffdf8a"/>' +
      '<g fill="#fff"><circle cx="30" cy="46" r="12"/><circle cx="44" cy="40" r="16"/><circle cx="60" cy="47" r="11"/><rect x="18" y="46" width="54" height="10" rx="5"/></g>' +
      '<path d="M84 88c6-8 2-12 8-18 6 6 2 10 8 18a8 8 0 0 1-16 0Z" fill="#1f6d8c"/>' +
      '<path d="M0 70q20 4 40 0t40 0 40 0" fill="none" stroke="#e7f6f9" stroke-width="2" opacity=".5"/>' +
      '</svg>'
  };

  function art(key) { return ART[key] || ""; }

  /* ============ data — all fictional ============ */
  var SHOWS = {
    tasogare:  { name: "黄昏トランジット",         studio: "スタジオ月虹", score: "9.2" },
    neon:      { name: "ネオン桜",                 studio: "AZUMA WORKS",  score: "8.9" },
    kamisama:  { name: "神様のバス停",             studio: "ひなた社",     score: "8.7" },
    hoshikuzu: { name: "星屑ダイナー",             studio: "コメット堂",   score: "8.5" },
    amane:     { name: "雨音レコード",             studio: "第九スタジオ", score: "8.3" },
    getsumen:  { name: "月面喫茶",                 studio: "しろくま座",   score: "8.1" },
    mermaid:   { name: "夏の終わりのマーメイド",   studio: "汐風アニメ",   score: "7.9" }
  };

  /* schedule per weekday: 月=0 … 日=6 (late-night 24h+ notation) */
  var SCHEDULE = [
    [ { t: "22:00", k: "getsumen",  ep: "第3話" }, { t: "24:30", k: "neon", ep: "第8話" } ],
    [ { t: "23:00", k: "amane",     ep: "第5話" } ],
    [ { t: "22:30", k: "mermaid",   ep: "第6話" }, { t: "25:00", k: "hoshikuzu", ep: "第10話" } ],
    [ { t: "21:30", k: "kamisama",  ep: "第7話" }, { t: "24:00", k: "tasogare", ep: "第7話", live: true }, { t: "25:30", k: "neon", ep: "再放送" } ],
    [ { t: "23:30", k: "hoshikuzu", ep: "第10話" }, { t: "24:00", k: "getsumen", ep: "第3話" } ],
    [ { t: "10:00", k: "mermaid",   ep: "第6話" }, { t: "22:00", k: "amane", ep: "第5話" }, { t: "24:00", k: "kamisama", ep: "第7話" } ],
    [ { t: "17:00", k: "tasogare",  ep: "一挙配信" } ]
  ];

  var CONTINUE = [
    { k: "amane",     ep: "EP 04", left: "残り 8分",  pct: 68 },
    { k: "hoshikuzu", ep: "EP 09", left: "残り 18分", pct: 23 },
    { k: "getsumen",  ep: "EP 02", left: "残り 2分",  pct: 91 },
    { k: "mermaid",   ep: "EP 05", left: "残り 12分", pct: 45 }
  ];

  var RANKING = ["tasogare", "neon", "kamisama", "hoshikuzu", "amane"];

  /* ============ schedule tabs ============ */
  var KANJI = ["月", "火", "水", "木", "金", "土", "日"];
  var daysEl = document.getElementById("days");
  var schedEl = document.getElementById("sched");
  var now = new Date();
  var todayIdx = (now.getDay() + 6) % 7; /* Mon=0 */

  KANJI.forEach(function (k, i) {
    var d = new Date(now);
    d.setDate(now.getDate() - todayIdx + i);
    var b = document.createElement("button");
    b.type = "button";
    b.className = "day";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", i === todayIdx ? "true" : "false");
    b.innerHTML = '<span class="kanji">' + k + '</span><span class="num">' +
      (i === todayIdx ? "きょう" : d.getDate()) + "</span>";
    b.addEventListener("click", function () { select(i); });
    daysEl.appendChild(b);
  });

  function select(i) {
    Array.prototype.forEach.call(daysEl.children, function (el, j) {
      el.setAttribute("aria-selected", j === i ? "true" : "false");
    });
    renderSched(i);
  }

  function renderSched(i) {
    var rows = SCHEDULE[i];
    schedEl.innerHTML = "";
    if (!rows.length) {
      schedEl.innerHTML = '<li class="empty">この日の放送はありません</li>';
      return;
    }
    rows.forEach(function (r) {
      var s = SHOWS[r.k];
      var li = document.createElement("li");
      if (r.live && i === todayIdx) li.className = "live";
      li.innerHTML =
        '<span class="t">' + r.t + "<small>JST</small></span>" +
        '<span class="body"><span class="name">' + s.name + '</span><br>' +
        '<span class="sub">' + s.studio + "・" + r.ep + "</span></span>" +
        '<span class="tag">' + (r.live && i === todayIdx ? "きょう" : "予定") + "</span>";
      schedEl.appendChild(li);
    });
  }
  renderSched(todayIdx);

  /* ============ continue-watching rail ============ */
  var cwEl = document.getElementById("cw");
  CONTINUE.forEach(function (c) {
    var s = SHOWS[c.k];
    var a = document.createElement("a");
    a.className = "cw-card";
    a.href = "#";
    a.addEventListener("click", function (e) { e.preventDefault(); });
    a.innerHTML =
      '<span class="art">' + art(c.k) +
      '<span class="bar"><i style="width:' + c.pct + '%"></i></span></span>' +
      '<span class="pad"><span class="name">' + s.name + "</span>" +
      '<span class="sub"><span>' + c.ep + "</span><span>" + c.left + "</span></span></span>";
    cwEl.appendChild(a);
  });

  /* ============ ranking ============ */
  var rankEl = document.getElementById("rank");
  RANKING.forEach(function (k, i) {
    var s = SHOWS[k];
    var li = document.createElement("li");
    li.innerHTML =
      '<span class="no">' + (i + 1) + '</span>' +
      '<span class="thumb">' + art(k) + "</span>" +
      '<span class="body"><span class="name">' + s.name + '</span><br>' +
      '<span class="sub">' + s.studio + "</span></span>" +
      '<span class="score">' + s.score + "</span>";
    rankEl.appendChild(li);
  });

  /* ============ countdown to tonight 24:00 ============ */
  var cdEl = document.getElementById("cd");
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function tickCd() {
    var t = new Date();
    var mid = new Date(t); mid.setHours(24, 0, 0, 0);
    var s = Math.max(0, Math.floor((mid - t) / 1000));
    var out = pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60);
    cdEl.textContent = out;
    cdEl.setAttribute("datetime", "PT" + s + "S");
  }
  tickCd();
  setInterval(tickCd, 1000);

  /* ============ tab bar (visual only) ============ */
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (tab, _, all) {
    tab.addEventListener("click", function () {
      Array.prototype.forEach.call(all, function (t) { t.setAttribute("aria-selected", "false"); });
      tab.setAttribute("aria-selected", "true");
    });
  });

  /* ============ hero canvas — twilight transit scene ============ */
  var cv = document.getElementById("sky");
  var ctx = cv.getContext("2d");
  var W = 0, H = 0, DPR = 1;
  var stars = [], clouds = [], buildings = [];

  function resize() {
    var r = cv.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seed();
    if (reduceMotion) draw(0);
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function seed() {
    stars = []; clouds = []; buildings = [];
    for (var i = 0; i < 70; i++) {
      stars.push({ x: rnd(0, W), y: rnd(0, H * .5), r: rnd(.4, 1.4), p: rnd(0, Math.PI * 2), s: rnd(.5, 2) });
    }
    for (var c = 0; c < 4; c++) {
      clouds.push({ x: rnd(-40, W), y: rnd(H * .28, H * .52), w: rnd(90, 190), h: rnd(5, 10), v: rnd(2.5, 6) });
    }
    var x = -10;
    while (x < W + 20) {
      var bw = rnd(18, 44), bh = rnd(20, 62);
      buildings.push({ x: x, w: bw, h: bh, win: Math.random() < .75 });
      x += bw + rnd(2, 7);
    }
  }

  /* train state */
  var TRAIN_W = 190, CARS = 3;
  var train = { t: -1, wait: 1.2 };

  function draw(time) {
    var t = time / 1000;
    var horizon = H * .60;

    /* sky */
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#181040");
    g.addColorStop(.42, "#43265e");
    g.addColorStop(.66, "#8f4468");
    g.addColorStop(.84, "#d67a5c");
    g.addColorStop(1, "#f2ab63");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* sun, low and hazy */
    var sunY = horizon + 6;
    var sg = ctx.createRadialGradient(W * .32, sunY, 4, W * .32, sunY, 70);
    sg.addColorStop(0, "rgba(255,236,170,.95)");
    sg.addColorStop(.25, "rgba(255,200,120,.5)");
    sg.addColorStop(1, "rgba(255,180,110,0)");
    ctx.fillStyle = sg;
    ctx.fillRect(W * .32 - 80, sunY - 80, 160, 160);
    ctx.fillStyle = "#ffeec2";
    ctx.beginPath(); ctx.arc(W * .32, sunY, 13, 0, Math.PI * 2); ctx.fill();

    /* stars */
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var a = .25 + .55 * Math.abs(Math.sin(st.p + t * st.s));
      a *= Math.max(0, 1 - st.y / (H * .55));
      ctx.globalAlpha = a;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(st.x, st.y, st.r, st.r);
    }
    ctx.globalAlpha = 1;

    /* clouds */
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      var cx = reduceMotion ? cl.x : (cl.x + t * cl.v) % (W + 160) - 80;
      ctx.fillStyle = "rgba(52,31,74,.38)";
      ctx.beginPath();
      ctx.ellipse(cx, cl.y, cl.w / 2, cl.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,160,110,.16)";
      ctx.beginPath();
      ctx.ellipse(cx + 6, cl.y + cl.h * .28, cl.w / 2.3, cl.h / 3.2, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    /* skyline */
    ctx.fillStyle = "#1c1438";
    for (var b = 0; b < buildings.length; b++) {
      var bd = buildings[b];
      ctx.fillRect(bd.x, horizon - bd.h, bd.w, bd.h);
    }
    ctx.fillStyle = "rgba(255,214,140,.85)";
    for (b = 0; b < buildings.length; b++) {
      bd = buildings[b];
      if (!bd.win) continue;
      var wx = bd.x + 4;
      while (wx < bd.x + bd.w - 5) {
        var wy = horizon - bd.h + 6;
        while (wy < horizon - 8) {
          if ((((wx * 13 + wy * 7) | 0) % 11) < 3) ctx.fillRect(wx, wy, 2.4, 3);
          wy += 9;
        }
        wx += 8;
      }
    }
    ctx.fillStyle = "rgba(242,171,99,.18)";
    ctx.fillRect(0, horizon - 1, W, 1);

    /* elevated rail */
    var railY = horizon + 16;
    ctx.fillStyle = "#120d28";
    ctx.fillRect(0, railY, W, 7);
    ctx.fillStyle = "rgba(18, 13, 40, .55)";
    for (var p = 8; p < W; p += 58) {
      ctx.fillRect(p, railY + 7, 6, H - railY);
    }

    /* train */
    if (!reduceMotion) {
      train.t += 1 / 60;
      var period = 9;
      var ph = (train.t % period) / period;
      if (ph < .62) {
        var ease = ph / .62;
        var tx = -TRAIN_W - 30 + (W + TRAIN_W + 60) * ease;
        drawTrain(tx, railY);
      }
    } else {
      drawTrain(W * .3, railY);
    }

    /* foreground wires + pole */
    ctx.strokeStyle = "rgba(10,7,22,.9)";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(0, H * .18);
    ctx.quadraticCurveTo(W * .5, H * .30, W, H * .14);
    ctx.moveTo(0, H * .23);
    ctx.quadraticCurveTo(W * .5, H * .36, W, H * .20);
    ctx.stroke();
    ctx.fillStyle = "#0b0719";
    ctx.fillRect(W - 26, H * .06, 5, H * .62);
    ctx.fillRect(W - 44, H * .13, 41, 3.4);
    ctx.fillRect(W - 40, H * .2, 33, 2.6);
  }

  function drawTrain(tx, railY) {
    var ty = railY - 14;
    for (var k = 0; k < CARS; k++) {
      var cxx = tx + k * (TRAIN_W / CARS + 3);
      var cw = TRAIN_W / CARS;
      ctx.fillStyle = "#0e0a20";
      if (ctx.roundRect) {
        ctx.beginPath(); ctx.roundRect(cxx, ty, cw, 14, 3); ctx.fill();
      } else {
        ctx.fillRect(cxx, ty, cw, 14);
      }
      ctx.fillStyle = "rgba(255,214,140,.9)";
      for (var wq = 5; wq < cw - 8; wq += 11) {
        ctx.fillRect(cxx + wq, ty + 3.5, 7, 5);
      }
    }
    /* headlight glow */
    var hg = ctx.createRadialGradient(tx + TRAIN_W + 4, ty + 8, 1, tx + TRAIN_W + 4, ty + 8, 26);
    hg.addColorStop(0, "rgba(255,235,180,.7)");
    hg.addColorStop(1, "rgba(255,235,180,0)");
    ctx.fillStyle = hg;
    ctx.fillRect(tx + TRAIN_W - 22, ty - 18, 52, 52);
  }

  function loop(time) {
    draw(time);
    requestAnimationFrame(loop);
  }

  resize();
  var ro = new ResizeObserver(resize);
  ro.observe(cv);
  if (!reduceMotion) requestAnimationFrame(loop);
})();
</script>
